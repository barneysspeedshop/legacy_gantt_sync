events {
    worker_connections 1024;
}

http {
    # Basic Hardening
    server_tokens off;
    client_max_body_size 10M;
    
    # Query strings and Referer can contain credentials.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    upstream dart_server {
        server server:8080;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Force HTTPS redirect for any non-localhost HTTP traffic
        set $redirect_https 0;
        if ($scheme = http) {
            set $redirect_https 1;
        }
        if ($host = localhost) {
            set $redirect_https 0;
        }
        if ($host = 127.0.0.1) {
            set $redirect_https 0;
        }
        if ($redirect_https = 1) {
            return 301 https://$host$request_uri;
        }

        # SSL Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

        # Security Headers
        # HSTS is disabled until valid certs are available
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        if ($request_uri ~* "[^a-zA-Z0-9\-._~:/?#\[\]@!$&'()*+,;=%]") {
            return 444; 
        }

        location ~* \.(php|git|env|aspx|jsp|cgi|sh|xml|txt|yaml|yml)$ {
            return 444;
        }

        # Server endpoints - No redirect on error
        location /api {
            proxy_pass http://dart_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth {
            proxy_pass http://dart_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://dart_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Default web routes - Redirect on error
        location / {
            proxy_pass http://dart_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 401 403 404 = @legacy_redirect;
        }

        location @legacy_redirect {
            return 302 https://legacy-automation.com;
        }
    }
}
