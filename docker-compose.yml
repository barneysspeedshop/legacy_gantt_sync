services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dart_user
      POSTGRES_PASSWORD: dart_password
      POSTGRES_DB: legacy_gantt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
