name: Ecosystem release check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dart_user
          POSTGRES_PASSWORD: release-test-only
          POSTGRES_DB: legacy_gantt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart_user -d legacy_gantt"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      TEST_DB_PORT: '5432'
      TEST_DB_PASS: release-test-only
      TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsqlite3-dev
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and verify the ecosystem
        run: bash scripts/check_release.sh
