name: Ecosystem release check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27.0.1.1+4'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter's required Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build both Android examples
        run: |
          python3 scripts/prepare_local_packages.py
          for example in legacy_gantt_chart/example legacy_pert_chart/example; do
            (cd "$example" && flutter pub get && flutter build apk --debug)
          done
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: dart_user
          POSTGRES_PASSWORD: release-test-only
          POSTGRES_DB: legacy_gantt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart_user -d legacy_gantt"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build sequential pinned server image
        run: docker build --tag gantt-sync-security-check .
      - name: Check runtime and FFI linkage
        run: |
          docker run --rm --entrypoint /bin/sh gantt-sync-security-check -ec '
            test -x /app/bin/server
            test -f /usr/lib/libgantt_solver_rs.so
            ldd /usr/lib/libgantt_solver_rs.so > /tmp/linkage
            cat /tmp/linkage
            if grep -q "not found" /tmp/linkage; then exit 1; fi
          '
      - name: Start the compiled server against disposable services
        run: |
          docker run -d --name gantt-image-smoke --network host \
            -e LEGACY_GANTT_SYNC_PORT=18080 \
            -e JWT_SECRET=image-smoke-test-only \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_USER=dart_user -e DB_PASS=release-test-only -e DB_NAME=legacy_gantt \
            -e DB_SSL_MODE=disable -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=6379 \
            -e SUPERUSER_USERNAME=image-test -e SUPERUSER_PASSWORD=image-smoke-test-only \
            gantt-sync-security-check
          trap 'docker logs gantt-image-smoke; docker rm -f gantt-image-smoke' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/image-health && grep -qx OK /tmp/image-health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Export tested runtime image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag gantt-sync-security-check "legacy_gantt_server:${GITHUB_SHA}"
          docker save "legacy_gantt_server:${GITHUB_SHA}" | gzip > server-image.tar.gz
          sha256sum server-image.tar.gz > server-image.tar.gz.sha256
      - name: Upload runtime image for SSH deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-image
          path: |
            server-image.tar.gz
            server-image.tar.gz.sha256
          retention-days: 1
          compression-level: 0
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2
      - name: Install pinned workflow parser
        run: |
          python3 -m venv "$RUNNER_TEMP/security-venv"
          "$RUNNER_TEMP/security-venv/bin/pip" install --require-hashes --only-binary=:all: --no-deps -r scripts/security-requirements.txt
      - name: Check workflow and dependency trust boundaries
        run: |
          "$RUNNER_TEMP/security-venv/bin/python" scripts/test_supply_chain.py
          "$RUNNER_TEMP/security-venv/bin/python" scripts/audit_supply_chain.py
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: dart_user
          POSTGRES_PASSWORD: release-test-only
          POSTGRES_DB: legacy_gantt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dart_user -d legacy_gantt"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
        ports:
          - 6379:6379
    env:
      TEST_DB_PORT: '5432'
      TEST_DB_PASS: release-test-only
      TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.14.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache-dependency-path: legacy_gantt_protocol/reference_server_go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip libsqlite3-dev
          PROTO_TOOLCHAIN_DIR="$RUNNER_TEMP/gantt-proto-toolchain" \
            PUB_CACHE="$RUNNER_TEMP/gantt-proto-pub-cache" \
            bash scripts/install_proto_toolchain.sh
          echo "$RUNNER_TEMP/gantt-proto-toolchain/protoc/bin" >> "$GITHUB_PATH"
          echo "PROTOC_GEN_DART=$RUNNER_TEMP/gantt-proto-pub-cache/bin/protoc-gen-dart" >> "$GITHUB_ENV"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and verify the ecosystem
        run: bash scripts/check_release.sh

      - name: Check resolved Dart, Rust, and Go advisories
        run: |
          python3 -m venv "$RUNNER_TEMP/advisory-venv"
          "$RUNNER_TEMP/advisory-venv/bin/pip" install --require-hashes --only-binary=:all: --no-deps -r scripts/security-requirements.txt
          "$RUNNER_TEMP/advisory-venv/bin/python" scripts/audit_dependency_advisories.py
